# Mantém actions e dependências atualizadas (e permite fixar actions por SHA
# com atualização automática, recomendação OWASP/SLSA contra supply chain).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    ignore:
      # TypeScript 7 é o compilador nativo (port em Go) — major com quebras de
      # tipos/ferramentas (eslint-config-next, next build). Decisão do dono:
      # SEGURAR o major até validação dedicada. Patches/minors do 5.x seguem.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
